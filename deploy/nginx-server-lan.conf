# LAN profile (docker-compose.yml): one address for the browser build, its game data, the match list and the game.
#   /         the exported web app   (SITE_DIR/app-current)
#   /data/    packed game data       (SITE_DIR/data-current)   LAN players only: never publish this profile
#   /ws       WebSocket game port    (game-lan:47700)
#   /matches  match list (JSON)      (game-lan:47702)
# Desktop players on the LAN join ws://<this machine>:<port>/ws. For the public internet use the public profile.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
	listen 80;
	server_name _;
	root /srv/siege/site/app-current;
	index index.html;

	include /etc/nginx/mime.types;
	types { application/wasm wasm; application/octet-stream pck; }
	gzip_static on;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Embedder-Policy "require-corp" always;
	add_header Cache-Control "no-cache" always;

	location / { try_files $uri $uri/ =404; }
	location /data/ { alias /srv/siege/site/data-current/; }

	location = /ws {
		proxy_pass http://game-lan:47700;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
	}
	location ~ ^/(matches|health)$ { proxy_pass http://game-lan:47702; }
}
